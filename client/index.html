<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Lomond Cabinet</title>
    <link rel="stylesheet" href="css/style.css?v=20260803-vela-0.3.0-release-1">
    <link rel="stylesheet" href="css/velaSurface.css?v=20260803-vela-0.3.0-release-1">
</head>
<body>
    <div class="app-shell" id="appShell">
        <div class="home-background" aria-hidden="true">
            <div class="bg-layer bg-base"></div>
            <div class="bg-layer bg-glow"></div>
            <div class="bg-layer bg-grid"></div>
            <div class="bg-layer bg-rings"></div>
            <div class="bg-layer bg-accent"></div>
            <canvas class="procedural-home-background-canvas" id="proceduralHomeBackgroundCanvas" aria-hidden="true"></canvas>
        </div>

        <section class="view view-home is-active" id="homeView">
            <header class="home-header">
                <div class="home-title-wrap">
                    <h1 data-i18n="app.title">Lomond Cabinet</h1>
                </div>
                <div class="home-header-actions">
                    <button class="panel-button home-edit-button" id="editHomeBtn" type="button" data-i18n="common.editHome">Edit Home</button>
                    <button class="panel-button round-button settings-entry" id="settingsBtn" title="Panel settings" aria-label="Panel settings" data-i18n-title="common.settings" data-i18n-aria-label="common.settings">
                        <span class="settings-glyph" aria-hidden="true"></span>
                    </button>
                </div>
            </header>

            <main class="home-content">
                <section id="velaSurfaceMount" class="vela-surface-mount" data-i18n-aria-label="vela.surfaceLabel"></section>
                <div class="tool-grid" id="toolGrid" aria-label="Tool grid">
                    <button class="tool-app app-card" id="openEcommerceLayoutTool" data-tool="ecommerceLayout">
                        <span class="tool-icon ecommerce-tool-icon">
                            <span class="commerce-glyph">A</span>
                        </span>
                        <span class="app-card-title" data-tool-title="ecommerceLayout">Ad Component Kit</span>
                    </button>

                    <button class="tool-app app-card" id="openVelaTool" data-tool="vela">
                        <span class="tool-icon vela-tool-icon">
                            <span class="commerce-glyph">V</span>
                        </span>
                        <span class="app-card-title" data-i18n="vela.title">Vela</span>
                    </button>

                    <button class="tool-app app-card is-disabled" disabled>
                        <span class="tool-icon more-icon">
                            <span class="plus-h"></span>
                            <span class="plus-v"></span>
                        </span>
                        <span class="app-card-title" data-i18n="tools.moreTools.title">More Tools</span>
                    </button>
                </div>
            </main>
        </section>

        <section class="view view-detail" id="detailView">
            <div class="detail-ui-layer">
            <header class="detail-header">
                <button class="panel-button back-button" id="backBtn">
                    <span class="button-glyph">&lt;</span>
                    <span data-i18n="common.home">Home</span>
                </button>
                <div class="detail-title">
                    <h2 id="detailHeading">Background Rounded Rectangle</h2>
                </div>
                <span class="selection-chip" id="selectionPill" data-i18n="selection.noSelection">No selection</span>
            </header>

            <main class="detail-content">
                <section class="registry-tool-panel tool-panel" id="registryToolPanel" data-tool-panel="__dynamic"></section>
            </main>

            <footer class="action-sheet tool-actions" id="registryToolActions" data-tool-actions="__dynamic"></footer>
            </div>
        </section>

        <section class="settings-view" id="settingsView" aria-hidden="true">
            <div class="settings-backdrop" id="settingsBackdrop"></div>
            <aside class="settings-panel panel-card" role="dialog" aria-label="Panel settings">
                <div class="settings-ui-layer">
                    <header class="settings-header">
                        <div>
                    <p class="overline" data-i18n="common.global">Global</p>
                    <h2 data-i18n="common.settings">Settings</h2>
                        </div>
                        <button class="panel-button round-button" id="closeSettingsBtn" title="Close settings" aria-label="Close settings" data-i18n-title="common.back" data-i18n-aria-label="common.back">
                            <span class="button-glyph">&lt;</span>
                        </button>
                    </header>

                    <div class="settings-content"></div>
                </div>
            </aside>
        </section>

        <div class="status-pill" id="statusPill">
            <span class="status-light"></span>
            <span id="statusText" data-i18n="status.ready">Ready</span>
        </div>
    </div>

    <script src="js/lib/CSInterface.js"></script>
    <script src="js/i18n.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/settingsSchema.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralCache.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralPaletteLibrary.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralPaletteStore.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralPaletteEditor.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralPaletteWorkspace.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralAppearance.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralThemeMap.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralPreviewContract.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralHomeIcons.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/proceduralHomeBackground.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaUi.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaProviderUi.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaResizeController.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaSurface.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaActivationPolicy.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaPresentationModel.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaTranscriptView.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaComposerView.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaConfirmationView.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaSurfaceController.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/vela/velaCepModuleLoader.js?v=20260803-vela-0.3.0-release-1"></script>
    <script src="js/main.js?v=20260803-vela-0.3.0-release-1"></script>
</body>
</html>
