name: Project checks

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check project consistency
        run: node scripts/check-project-consistency.js

      - name: Check host project version
        run: node scripts/check-host-project-version.js

      - name: Test procedural determinism
        run: node scripts/test-procedural-determinism.js

      - name: Test procedural preview contract
        run: node scripts/test-procedural-preview-contract.js

      - name: Test procedural cache
        run: node scripts/test-procedural-cache.js

      - name: Test procedural Home icons
        run: node scripts/test-procedural-home-icons.js

      - name: Test procedural Home background
        run: node scripts/test-procedural-home-background.js

      - name: Test procedural Theme Map
        run: node scripts/test-procedural-theme-map.js

      - name: Test procedural palette library
        run: node scripts/test-procedural-palette-library.js

      - name: Test procedural palette store
        run: node scripts/test-procedural-palette-store.js

      - name: Test procedural palette editor
        run: node scripts/test-procedural-palette-editor.js

      - name: Test procedural palette workspace
        run: node scripts/test-procedural-palette-workspace.js

      - name: Test Theme Settings integration
        run: node scripts/test-theme-settings-integration.js

      - name: Verify generated i18n report
        run: node scripts/report-i18n-usage.js --check
